name: Lynlo HyperFrames mirror sync

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Revalidate and rebuild the current upstream revision
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: lynlo-hyperframes-mirror-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout mirror
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "lynlo-mirror[bot]"
          git config user.email "lynlo-mirror[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/heygen-com/hyperframes.git
          git fetch upstream main --tags

      - id: upstream
        name: Discover upstream revision
        run: |
          upstream_sha="$(git rev-parse upstream/main)"
          current_sha="$(jq -r '.upstream.commit // ""' catalog/current.json)"
          force="${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}"
          echo "sha=${upstream_sha}" >> "${GITHUB_OUTPUT}"
          if [ "${upstream_sha}" = "${current_sha}" ] && [ "${force}" != "true" ]; then
            echo "update=false" >> "${GITHUB_OUTPUT}"
          else
            echo "update=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Validate upstream and build catalog
        if: steps.upstream.outputs.update == 'true'
        run: |
          upstream_sha="${{ steps.upstream.outputs.sha }}"
          upstream_root="${RUNNER_TEMP}/hyperframes-upstream"
          catalog_output="${RUNNER_TEMP}/current.json"
          git worktree add --detach "${upstream_root}" upstream/main
          node --test scripts/lynlo-build-template-catalog.test.mjs
          node scripts/lynlo-build-template-catalog.mjs \
            --source-root "${upstream_root}" \
            --output "${catalog_output}" \
            --upstream-commit "${upstream_sha}" \
            --synced-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"

      - name: Publish validated mirror
        if: steps.upstream.outputs.update == 'true'
        run: |
          upstream_sha="${{ steps.upstream.outputs.sha }}"
          upstream_root="${RUNNER_TEMP}/hyperframes-upstream"
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            --exclude='Domain.md' \
            --exclude='catalog/' \
            --exclude='scripts/lynlo-build-template-catalog.mjs' \
            --exclude='scripts/lynlo-build-template-catalog.test.mjs' \
            "${upstream_root}/" ./
          mkdir -p catalog
          cp "${RUNNER_TEMP}/current.json" catalog/current.json
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(mirror): sync HyperFrames ${upstream_sha:0:12}"
          fi
          tag="upstream-${upstream_sha}"
          if ! git rev-parse --verify --quiet "refs/tags/${tag}"; then
            git tag -a "${tag}" -m "HyperFrames upstream ${upstream_sha}"
          fi
          git push origin HEAD:main --follow-tags
